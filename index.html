<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2026</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: radial-gradient(circle at bottom, #020111, #000000);
    overflow: hidden;
    height: 100vh;
    color: white;
}

/* Center Card */
.card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.6);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    width: 90%;
    max-width: 380px;
    z-index: 10;
}

.card h1 {
    font-size: 32px;
}

.card p {
    font-size: 16px;
    margin-top: 10px;
}

.name {
    margin-top: 15px;
    font-size: 18px;
    color: gold;
}

/* Fireworks */
.firework {
    position: absolute;
    width: 6px;
    height: 6px;
    background: transparent;
    border-radius: 50%;
    animation: explode 1.5s ease-out infinite;
}

@keyframes explode {
    0% {
        transform: scale(0);
        opacity: 1;
        box-shadow:
        0 0 #ff0,
        0 0 #f0f,
        0 0 #0ff,
        0 0 #fff;
    }
    100% {
        transform: scale(1);
        opacity: 0;
        box-shadow:
        80px -80px #ff0,
        -80px -80px #f0f,
        80px 80px #0ff,
        -80px 80px #fff;
    }
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Fireworks -->
<div class="firework" style="top:20%; left:30%;"></div>
<div class="firework" style="top:40%; left:70%; animation-delay:0.5s;"></div>
<div class="firework" style="top:60%; left:50%; animation-delay:1s;"></div>

<!-- Message Card -->
<div class="card">
    <h1>🎆 Happy New Year 2026 🎆</h1>
    <p>
        Naya saal aapke jeevan me  
        <br>khushiyan, safalta aur sehat laaye ✨
    </p>
    <div class="name">— Best Wishes from Aniket</div>
</div>

</body>
</html>
